name: Quaelgeist-APK bauen

on:
  push:
    branches:
      - main
      - next
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write # für das GitHub Release auf main bzw. next

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Steigt mit jedem Lauf – Android installiert Updates nur bei höherem versionCode.
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Branch `next`: Beta-Variante (App-ID de.quaelgeist.beta, läuft neben Quälgeist).
      QUAELGEIST_BETA: ${{ github.ref == 'refs/heads/next' }}
      APK_NAME: ${{ github.ref == 'refs/heads/next' && 'Quaelgeist-Beta' || 'Quaelgeist' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests und Lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Signaturschlüssel aus Secret wiederherstellen
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signierte Release-APK bauen
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}-${VERSION_CODE}.apk"

      # Ohne Secrets: Debug-APK, damit der Build trotzdem grün ist. Debug-APKs
      # aus dem CI sind bei jedem Lauf anders signiert – Updates darüber
      # schlagen fehl ("App nicht installiert"), nur zum Ausprobieren.
      - name: Debug-APK bauen (keine Signatur-Secrets hinterlegt)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Keine Signatur-Secrets hinterlegt – es wird nur eine Debug-APK gebaut (siehe README.md)."
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}-${VERSION_CODE}-debug.apk"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Quaelgeist-apk
          path: Quaelgeist-*.apk

      - name: GitHub Release anlegen (nur main, nur signiert)
        if: github.ref == 'refs/heads/main' && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "quaelgeist-v${VERSION_CODE}" "${APK_NAME}-${VERSION_CODE}.apk" \
            --title "quaelgeist-v${VERSION_CODE}" \
            --notes "Automatischer Build von ${GITHUB_SHA::7}."

      # Eigener Tag-Präfix: Obtainium filtert die stabile App auf ^quaelgeist-v, die Beta auf
      # ^quaelgeist-beta-v. Bewusst keine Vorabversion – die ignoriert Obtainium standardmäßig.
      - name: GitHub Release anlegen (nur next, nur signiert)
        if: github.ref == 'refs/heads/next' && env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "quaelgeist-beta-v${VERSION_CODE}" "${APK_NAME}-${VERSION_CODE}.apk" \
            --title "quaelgeist-beta-v${VERSION_CODE}" \
            --notes "Beta-Build von ${GITHUB_SHA::7} (Branch next)."
